<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAARC-AA — SAARC Anesthesiologists' Association</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650;9..144,720&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A211E;
    --ink-soft:#525C57;
    --surface:#F5F7F5;
    --surface-alt:#FFFFFF;
    --primary:#0F6656;
    --primary-light:#16856F;
    --primary-dark:#0A4A3F;
    --accent:#E8604A;
    --accent-soft:#FBDCD3;
    --secondary:#2F7A93;
    --line:#E2E7E3;
    --danger:#A33B2B;
    --danger-soft:#F3D9D3;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(16,30,25,.05);
    --shadow-md:0 10px 28px -14px rgba(16,30,25,.22);
    --serif:'Fraunces', Georgia, serif;
    --sans:'Inter', -apple-system, Segoe UI, sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%;}
  body{
    margin:0;font-family:var(--sans);background:var(--surface);color:var(--ink);
    line-height:1.55;-webkit-font-smoothing:antialiased;
    transition:background .35s ease;
    overflow-x:hidden;max-width:100%;
  }
  a{color:inherit;text-decoration:none;}
  h1,h2,h3,h4{font-family:var(--serif);margin:0 0 .4em 0;color:var(--primary-dark);font-weight:600;}
  p{margin:0 0 1em 0;}
  button{font-family:var(--sans);cursor:pointer;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* ---------- Header ---------- */
  header.site-header{background:var(--surface-alt);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;}
  .header-inner{max-width:1080px;margin:0 auto;padding:14px 24px 10px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand-mark{
    width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, var(--primary-light), var(--primary-dark));
    border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--serif);font-weight:700;font-size:15px;flex-shrink:0;
  }
  .brand-text .name{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--primary-dark);line-height:1.1;}
  .brand-text .sub{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);}
  nav.main-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  nav.main-nav button.navlink{padding:8px 12px;border-radius:8px;font-size:14.5px;font-weight:500;color:var(--ink-soft);background:none;border:none;}
  nav.main-nav button.navlink:hover{background:var(--surface);color:var(--primary-dark);}
  nav.main-nav button.navlink.active{background:var(--primary);color:#fff;}
  .btn-login{background:var(--accent) !important;color:#2b1c04 !important;font-weight:600 !important;}
  .btn-login:hover{background:#a97a29 !important;color:#fff !important;}

  /* presidency ribbon */
  .ribbon{border-top:1px solid var(--line);background:#FAFBF9;}
  .ribbon-inner{max-width:1080px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;gap:10px;overflow-x:auto;}
  .ribbon-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);flex-shrink:0;margin-right:2px;}
  .ribbon-badge{
    display:flex;align-items:center;gap:5px;padding:3px 9px 3px 6px;border-radius:20px;
    font-size:12px;color:var(--ink-soft);border:1px solid transparent;white-space:nowrap;flex-shrink:0;
  }
  .ribbon-badge .flag{font-size:14px;}
  .ribbon-badge.host{background:var(--primary);color:#fff;font-weight:600;border-color:var(--primary);}

  /* ---------- Header accent bar ---------- */
  .accent-bar{height:3px;background:linear-gradient(90deg, var(--primary), var(--accent));}

  /* ---------- Hero ---------- */
  .hero{position:relative;overflow:hidden;color:#fff;padding:48px 0 0 0;}
  .hero-bg-slideshow{position:absolute;inset:0;z-index:0;}
  .hero-bg-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:translateX(100%);transition:transform 1.1s ease, opacity 1.1s ease;}
  .hero-bg-slide.active{opacity:1;transform:translateX(0);}
  .hero-bg-slide.prev{opacity:0;transform:translateX(-100%);}
  .hero-bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg, var(--primary-dark), var(--primary));opacity:0.82;transition:background .35s ease;}
  .hero-inner{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 24px 40px 24px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;}
  .hero .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft);font-weight:600;margin-bottom:10px;}
  .hero h1{color:#fff;font-size:clamp(28px,4vw,42px);line-height:1.15;max-width:560px;}
  .hero p.lede{color:#E4ECE7;max-width:480px;font-size:16px;}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .stat-card{background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.2);border-radius:var(--radius);padding:16px;}
  .stat-card .num{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--accent-soft);}
  .stat-card .lbl{font-size:12px;color:#D6E2DC;margin-top:2px;}

  /* ---------- Section shells ---------- */
  main{min-height:60vh;}
  .section{padding-top:44px;padding-bottom:44px;}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .section-head h2{font-size:24px;}
  .section-head .see-all{font-size:13.5px;font-weight:600;color:var(--secondary);border-bottom:1px solid var(--secondary);padding-bottom:1px;}

  .tri-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;}
  .info-card{background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .15s, transform .15s;}
  .info-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .info-card .tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary);background:#E4EEE9;padding:3px 9px;border-radius:20px;margin-bottom:10px;}
  .info-card h3{font-size:17px;margin-bottom:6px;}
  .info-card p{font-size:14px;color:var(--ink-soft);margin-bottom:0;}

  /* ---------- Post feed / cards ---------- */
  .post-list{display:flex;flex-direction:column;gap:16px;}
  .post-card{background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;cursor:pointer;transition:box-shadow .15s, transform .15s;box-shadow:var(--shadow-sm);}
  .post-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .post-meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-soft);margin-bottom:8px;flex-wrap:wrap;}
  .pill{padding:2px 9px;border-radius:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;}
  .post-card h3{font-size:18px;margin-bottom:6px;}
  .post-excerpt{font-size:14.5px;color:var(--ink-soft);}
  .type-icon{font-family:var(--mono);font-size:11px;color:var(--accent);}

  /* ---------- Gallery ---------- */
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:14px 0;}
  .gallery-tile{aspect-ratio:4/3;border-radius:8px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px;font-weight:600;position:relative;overflow:hidden;border:1px solid rgba(0,0,0,0.06);}
  .gallery-tile .cap{background:rgba(0,0,0,0.38);padding:4px 8px;border-radius:6px;line-height:1.3;}
  .gallery-tile .ph-icon{position:absolute;top:10px;right:10px;font-size:20px;opacity:.55;}

  /* ---------- Table ---------- */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0;}
  table.data-table{width:100%;border-collapse:collapse;margin:0;font-size:14px;}
  table.data-table th, table.data-table td{border:1px solid var(--line);padding:9px 12px;text-align:left;}
  table.data-table th{background:var(--surface);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--primary-dark);}
  table.data-table tr:nth-child(even) td{background:#FAFBF9;}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-light);}
  .btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--secondary);color:var(--secondary);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:14px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;min-height:110px;}
  .field-hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card-panel{background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-sm);}
  .narrow{max-width:440px;margin:0 auto;}

  /* ---------- Admin ---------- */
  .admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .admin-badge{font-size:13px;color:var(--ink-soft);}
  .admin-badge strong{color:var(--primary-dark);}
  .counter-card{background:var(--primary-dark);color:#fff;border-radius:var(--radius);padding:22px 26px;display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
  .counter-card .num{font-family:var(--mono);font-size:38px;font-weight:600;color:var(--accent-soft);}
  .counter-card .lbl{font-size:13px;color:#CBD9D2;text-transform:uppercase;letter-spacing:.08em;}
  .storage-meter{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px;margin-bottom:26px;}
  .admin-post-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .admin-post-row:last-child{border-bottom:none;}
  .admin-post-row .info small{color:var(--ink-soft);}
  .gallery-editor-row, .table-row-editor{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .gallery-editor-row input, .table-row-editor input{flex:1;}
  .gallery-upload-row{display:flex;gap:10px;margin-bottom:10px;align-items:center;}
  .gallery-thumb{width:64px;height:64px;flex-shrink:0;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);text-align:center;}
  .file-upload-btn{display:inline-block;font-size:12.5px;font-weight:600;color:var(--secondary);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;width:fit-content;background:#fff;}
  .file-upload-btn:hover{border-color:var(--secondary);}
  .icon-btn{background:none;border:none;color:var(--danger);font-size:16px;padding:4px 8px;}

  /* ---------- Content blocks (post editor + rendered file downloads) ---------- */
  .block-card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:#fff;}
  .block-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .block-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--secondary);}
  .block-controls{display:flex;gap:4px;}
  .block-controls button{background:var(--surface);border:1px solid var(--line);border-radius:6px;width:26px;height:26px;font-size:12px;color:var(--ink-soft);}
  .block-controls button:hover:not(:disabled){border-color:var(--secondary);color:var(--secondary);}
  .block-controls button:disabled{opacity:.35;cursor:not-allowed;}
  .add-block-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .file-download-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;}
  .embed-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--radius);background:#000;}
  .embed-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .file-download-icon{font-size:26px;flex-shrink:0;}

  /* ---------- Lightbox / carousel viewer ---------- */
  .lightbox-backdrop{position:fixed;inset:0;background:rgba(10,14,12,0.92);z-index:200;display:flex;align-items:center;justify-content:center;padding:40px;}
  .lightbox-content{max-width:90vw;max-height:85vh;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lightbox-content img{max-width:90vw;max-height:78vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .lightbox-caption{color:#fff;font-size:14px;text-align:center;max-width:600px;}
  .lightbox-counter{color:rgba(255,255,255,0.65);font-size:12px;font-family:var(--mono);}
  .lightbox-close{position:absolute;top:18px;right:22px;background:rgba(255,255,255,0.14);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;}
  .lightbox-close:hover{background:rgba(255,255,255,0.24);}
  .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.14);border:none;color:#fff;width:48px;height:48px;border-radius:50%;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .lightbox-nav:hover{background:rgba(255,255,255,0.24);}
  .lightbox-prev{left:18px;}
  .lightbox-next{right:18px;}
  @media (max-width:600px){
    .lightbox-nav{width:40px;height:40px;font-size:20px;}
    .lightbox-prev{left:6px;}
    .lightbox-next{right:6px;}
    .lightbox-backdrop{padding:16px;}
  }

  .alert{padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:16px;}
  .alert-error{background:var(--danger-soft);color:var(--danger);}
  .alert-success{background:#DCEFE3;color:var(--primary-dark);}

  /* ---------- Theme picker ---------- */
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px;}
  .theme-card{border:2px solid var(--line);border-radius:var(--radius);padding:14px;background:#fff;position:relative;transition:border-color .15s;cursor:pointer;}
  .theme-card.active-theme{border-color:var(--primary);}
  .theme-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .theme-card .swatches{display:flex;gap:6px;}
  .theme-card .swatch{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,0.1);}
  .theme-card h4{font-size:14.5px;margin-bottom:2px;}
  .theme-card .flagline{font-size:12px;color:var(--ink-soft);margin-bottom:0;}
  .icon-edit-btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:28px;height:28px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}
  .icon-edit-btn:hover{color:var(--primary-dark);border-color:var(--secondary);}
  .active-inline-tag, .custom-inline-tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.03em;}
  .active-inline-tag{color:var(--primary);background:#E4EEE9;}
  .custom-inline-tag{color:var(--secondary);background:#E7F1F4;}

  footer{background:var(--primary-dark);color:#CBD9D2;padding:36px 0;margin-top:40px;transition:background .35s ease;}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;font-size:13px;}
  footer .members{opacity:.8;max-width:560px;}

  .breadcrumb{font-size:13px;color:var(--secondary);margin-bottom:14px;display:inline-block;}
  .tab-row{display:flex;gap:6px;margin-bottom:20px;}
  .tab-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink-soft);}
  .tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .storage-note{font-size:11.5px;color:var(--ink-soft);text-align:center;padding:10px 24px 0 24px;}

  @media (max-width:760px){
    .hero-inner{grid-template-columns:1fr;}
    .tri-grid{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    footer .wrap{flex-direction:column;}
    nav.main-nav{gap:2px;}
    nav.main-nav button.navlink{padding:7px 8px;font-size:13px;}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand" onclick="navigate('home')">
      <div class="brand-mark">SAA</div>
      <div class="brand-text">
        <div class="name">SAARC-AA</div>
        <div class="sub">Anesthesiologists' Association</div>
      </div>
    </div>
    <nav class="main-nav" id="mainNav"></nav>
  </div>
  <div class="ribbon"><div class="ribbon-inner" id="ribbonRow"></div></div>
  <div class="accent-bar"></div>
</header>

<main id="app"></main>
<div id="lightboxOverlay"></div>

<footer>
  <div class="wrap">
    <div>
      <strong style="color:#fff;" id="footerTitle">SAARC Anesthesiologists' Association</strong><br>
      <span id="footerTagline">Advancing the science and practice of anesthesiology across South Asia.</span>
    </div>
    <div class="members" id="footerMembers"></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   SUPABASE CONNECTION
   Fill these in from your Supabase project:
   Dashboard > Project Settings > API > Project URL / anon public key
   ========================================================= */
const SUPABASE_URL = 'https://beijsnnzxldhygvomyhl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlaWpzbm56eGxkaHlndm9teWhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTgzNzgsImV4cCI6MjEwMzM3NDM3OH0.cMaVMAlCsWs56QpzHo8UJjOeaahzSCiPRbRnxoLr6Hc';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   SETTINGS LAYER — a simple key/value table (site_settings) in
   Supabase holds posts, editable page content, the active theme,
   and theme color overrides. Reading is public; writing requires
   an admin to be logged in (enforced by Row Level Security on the
   database side, not just in this JS).
   ========================================================= */
async function fetchSetting(key, fallback){
  const { data, error } = await supabaseClient.from('site_settings').select('value').eq('key', key).maybeSingle();
  if(error || !data) return fallback;
  return data.value;
}
async function upsertSetting(key, value){
  const { error } = await supabaseClient.from('site_settings').upsert({ key, value, updated_at: new Date().toISOString() });
  if(error){ console.error('Supabase save failed for', key, error); return false; }
  return true;
}
async function getVisitCount(){
  const { data, error } = await supabaseClient.rpc('increment_visits');
  if(error){ console.error('Visit counter RPC failed', error); return 0; }
  return data;
}
/* Real login now goes through Supabase Auth (email + password), so no
   passwords live in this file. After a successful sign-in, we look up
   the signed-in email in the 'admin_roles' table (see
   admin_roles_setup.sql) to find out which of these three roles they
   are — this avoids needing to touch Supabase's protected auth.users
   table directly. */
const ROLE_LABELS = {
  president: 'President',
  vicepresident: 'Vice President',
  generalsecretary: 'General Secretary'
};

/* All editable page copy lives here — the President, Vice President, and
   General Secretary can change any of it from the admin dashboard's
   "Site Content" editor, without touching code. */
const DEFAULT_CONTENT = {
  heroHeadline: "Advancing safe anesthesia care across South Asia, together.",
  heroLede: "SAARC-AA connects national anesthesiology societies from eight member countries to share research, set regional standards of care, and train the next generation of anesthesiologists.",
  heroStats: [
    { value: '8', label: 'Member Countries' },
    { value: '1987', label: 'Founded' },
    { value: '3,200+', label: 'Affiliated Members' },
    { value: '11', label: 'Regional Congresses Held' }
  ],
  footerTitle: "SAARC Anesthesiologists' Association",
  footerTagline: "Advancing the science and practice of anesthesiology across South Asia.",
  aboutIntro: "The SAARC Anesthesiologists' Association (SAARC-AA) is the regional professional body representing national anesthesiology societies across Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, and Sri Lanka. Founded in 1987, the association exists to advance safe anesthesia practice, share clinical research, and coordinate continuing education across South Asia.",

let CONTENT = {};
async function loadContent(){
  const parsed = await fetchSetting('content', null);
  if(parsed){
    let addressLines = (parsed.addressLines && parsed.addressLines.length) ? parsed.addressLines : null;
    if(!addressLines && typeof parsed.contactAddress === 'string' && parsed.contactAddress.trim()){
      // one-time migration from the old single-textarea address field
      addressLines = parsed.contactAddress.split('\n').map(l=>l.trim()).filter(Boolean);
    }
    return Object.assign({}, DEFAULT_CONTENT, parsed, {
      execNames: Object.assign({}, DEFAULT_CONTENT.execNames, parsed.execNames||{}),
      heroStats: (parsed.heroStats && parsed.heroStats.length) ? parsed.heroStats : DEFAULT_CONTENT.heroStats,
      addressLines: (addressLines && addressLines.length) ? addressLines : DEFAULT_CONTENT.addressLines
    });
  }
  return JSON.parse(JSON.stringify(DEFAULT_CONTENT));
}
async function saveContent(c){
  CONTENT = c;
  const ok = await upsertSetting('content', c);
  renderRibbonAndFooter();
  return ok;
}

/* =========================================================
   CATEGORIES — admin-editable list of top-level categories,
   each optionally holding its own subcategories (e.g.
   "Conferences" holds "Upcoming" and "Past"). Stored under the
   'categories' settings key, alongside posts/content/theme.
   ========================================================= */
const DEFAULT_CATEGORIES = [
  { key: 'current', label: 'Current Work', subcategories: [] },
  { key: 'conferences', label: 'Conferences', subcategories: [
      { key: 'upcoming', label: 'Upcoming' },
      { key: 'past', label: 'Past' }
  ]}
];
let CATEGORIES = [];
async function loadCategories(){
  const parsed = await fetchSetting('categories', null);
  if(parsed && Array.isArray(parsed) && parsed.length) return parsed;
  return JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
}
async function saveCategories(cats){
  CATEGORIES = cats;
  return await upsertSetting('categories', cats);
}
function slugifyUnique(label, usedKeys){
  const base = String(label).toLowerCase().trim().replace(/[^a-z0-9]+/g,'') || 'category';
  let key = base, n = 2;
  while(usedKeys.has(key)){ key = base + n; n++; }
  usedKeys.add(key);
  return key;
}
function findCategory(key){ return CATEGORIES.find(c=>c.key===key); }
function findSubcategory(catKey, subKey){
  const cat = findCategory(catKey);
  return cat ? (cat.subcategories||[]).find(s=>s.key===subKey) : null;
}
/* Old posts may still carry a flat legacy category (upcoming/past/general)
   from before categories had subcategories — this resolves any post to
   its effective {category, subcategory, categoryLabel, subcategoryLabel}
   under the CURRENT category structure, without needing to touch the
   database until that post is next edited and saved. */
function effectiveCategory(post){
  let category = post.category, subcategory = post.subcategory || null;
  if(category==='upcoming' || category==='past'){ subcategory = category; category = 'conferences'; }
  if(category==='general'){ category = 'current'; subcategory = null; }
  const cat = findCategory(category);
  const sub = subcategory ? findSubcategory(category, subcategory) : null;
  return {
    category, subcategory,
    categoryLabel: cat ? cat.label : category,
    subcategoryLabel: sub ? sub.label : subcategory
  };
}
const PILL_COLOR_PALETTE = [
  { bg:'#E4EEE9', fg:'#1F6650' }, { bg:'#F5E9D3', fg:'#8A5E15' }, { bg:'#E7E7E9', fg:'#4B4B52' },
  { bg:'#DDEAEA', fg:'#2F7A93' }, { bg:'#F3D9D3', fg:'#A33B2B' }, { bg:'#E3E0F5', fg:'#5B4FA3' }
];
function pillColorFor(key){
  let h = 0;
  const str = String(key||'');
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) % PILL_COLOR_PALETTE.length; }
  return PILL_COLOR_PALETTE[Math.abs(h)];
}
function pillHtml(post){
  const eff = effectiveCategory(post);
  const label = eff.subcategoryLabel || eff.categoryLabel || 'Uncategorized';
  const c = pillColorFor(eff.subcategory || eff.category);
  return `<span class="pill" style="background:${c.bg};color:${c.fg};">${esc(label)}</span>`;
}

/* =========================================================
   CATEGORY EDITOR — lets admins add/rename/remove top-level
   categories and their subcategories (e.g. Conferences →
   Upcoming/Past). A category or subcategory still in use by a
   post can't be removed until that post is moved or deleted.
   ========================================================= */
let categoryDraft = null;

function categoryInUse(catKey, subKey){
  return POSTS.some(p=>{
    const eff = effectiveCategory(p);
    if(subKey){ return eff.category===catKey && eff.subcategory===subKey; }
    return eff.category===catKey;
  });
}
function openCategoryEditor(){
  categoryDraft = JSON.parse(JSON.stringify(CATEGORIES));
  renderCategoryEditorModal();
}
function closeCategoryEditor(){
  categoryDraft = null;
  const el = document.getElementById('categoryEditorModal');
  if(el) el.innerHTML = '';
}
function updateCategoryLabel(catIndex, val){ categoryDraft[catIndex].label = val; }
function updateSubcategoryLabel(catIndex, subIndex, val){ categoryDraft[catIndex].subcategories[subIndex].label = val; }
function addCategoryDraft(){
  categoryDraft.push({ key: null, label: '', subcategories: [] });
  renderCategoryEditorModal();
}
function addSubcategoryDraft(catIndex){
  categoryDraft[catIndex].subcategories.push({ key: null, label: '' });
  renderCategoryEditorModal();
}
function removeCategoryDraft(catIndex){
  const cat = categoryDraft[catIndex];
  if(cat.key && categoryInUse(cat.key)){
    alert(`Can't remove "${cat.label}" — some posts still use it. Move or delete those posts first.`);
    return;
  }
  categoryDraft.splice(catIndex,1);
  renderCategoryEditorModal();
}
function removeSubcategoryDraft(catIndex, subIndex){
  const cat = categoryDraft[catIndex];
  const sub = cat.subcategories[subIndex];
  if(cat.key && sub.key && categoryInUse(cat.key, sub.key)){
    alert(`Can't remove "${sub.label}" — some posts still use it. Move or delete those posts first.`);
    return;
  }
  cat.subcategories.splice(subIndex,1);
  renderCategoryEditorModal();
}
function renderCategoryEditorModal(){
  const holder = document.getElementById('categoryEditorModal');
  if(!holder) return;
  if(!categoryDraft){ holder.innerHTML = ''; return; }
  holder.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(22,36,31,0.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100;">
      <div class="card-panel" style="max-width:560px;width:100%;background:#fff;">
        <h3>Edit Categories</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-8px;">Posts already using a category or subcategory must be moved or deleted before you can remove it.</p>
        ${categoryDraft.map((cat,ci)=>`
          <div class="block-card">
            <div class="block-card-head">
              <input type="text" value="${esc(cat.label)}" placeholder="Category name" oninput="updateCategoryLabel(${ci}, this.value)" style="font-weight:700;border:1px solid transparent;background:none;padding:4px 2px;font-size:15px;flex:1;">
              <button type="button" class="icon-btn" onclick="removeCategoryDraft(${ci})" title="Remove category">✕</button>
            </div>
            ${cat.subcategories.map((sub,si)=>`
              <div class="gallery-editor-row" style="margin-left:14px;">
                <input type="text" value="${esc(sub.label)}" placeholder="Subcategory name" oninput="updateSubcategoryLabel(${ci},${si},this.value)">
                <button type="button" class="icon-btn" onclick="removeSubcategoryDraft(${ci},${si})">✕</button>
              </div>
            `).join('')}
            <button type="button" class="btn btn-outline btn-sm" style="margin-left:14px;" onclick="addSubcategoryDraft(${ci})">+ Add Subcategory</button>
          </div>
        `).join('')}
        <button type="button" class="btn btn-outline btn-sm" onclick="addCategoryDraft()">+ Add Category</button>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
          <button type="button" class="btn btn-outline" onclick="closeCategoryEditor()">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveCategoryEdit()">Save Categories</button>
        </div>
      </div>
    </div>`;
}
async function saveCategoryEdit(){
  const usedKeys = new Set();
  categoryDraft.forEach(cat=>{ if(cat.key) usedKeys.add(cat.key); (cat.subcategories||[]).forEach(s=>{ if(s.key) usedKeys.add(s.key); }); });
  const cleaned = categoryDraft
    .filter(cat=>cat.label && cat.label.trim())
    .map(cat=>{
      const key = cat.key || slugifyUnique(cat.label, usedKeys);
      const subs = (cat.subcategories||[])
        .filter(s=>s.label && s.label.trim())
        .map(s=>({ key: s.key || slugifyUnique(s.label, usedKeys), label: s.label.trim() }));
      return { key, label: cat.label.trim(), subcategories: subs };
    });
  if(!cleaned.length){ alert('You need at least one category.'); return; }
  await saveCategories(cleaned);
  categoryDraft = null;
  render();
}

// THEMES starts as a copy of the defaults, then gets any saved admin
// customizations merged on top of it in buildThemes() at init time.
let THEMES = {};
let themeOverridesCache = {}; // in-memory copy of the 'theme_overrides' setting, kept in sync with Supabase

function cloneDefaultThemes(){ return JSON.parse(JSON.stringify(DEFAULT_THEMES)); }
async function buildThemes(){
  const base = cloneDefaultThemes();
  themeOverridesCache = await fetchSetting('theme_overrides', {});
  Object.keys(themeOverridesCache).forEach(key=>{
    if(base[key]){ base[key] = Object.assign({}, base[key], themeOverridesCache[key]); }
  });
  return base;
}
function hasCustomOverride(key){
  return !!themeOverridesCache[key];
}
async function saveThemeOverride(key, colors){
  themeOverridesCache[key] = Object.assign({}, themeOverridesCache[key]||{}, colors);
  THEMES[key] = Object.assign({}, THEMES[key], colors);
  return await upsertSetting('theme_overrides', themeOverridesCache);
}
async function resetThemeOverride(key){
  delete themeOverridesCache[key];
  THEMES[key] = Object.assign({}, DEFAULT_THEMES[key]);
  return await upsertSetting('theme_overrides', themeOverridesCache);
}

function shadeColor(hex, percent){
  hex = hex.replace('#','');
  let r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  const adj = (c)=>{
    const delta = percent>0 ? (255-c) : c;
    return Math.min(255, Math.max(0, Math.round(c + (percent/100)*delta)));
  };
  r=adj(r); g=adj(g); b=adj(b);
  return '#' + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

let currentThemeKey = 'standard';
async function applyTheme(key, persist){
  const t = THEMES[key] || THEMES.standard;
  const root = document.documentElement.style;
  root.setProperty('--primary', t.primary);
  root.setProperty('--primary-light', shadeColor(t.primary, 22));
  root.setProperty('--primary-dark', shadeColor(t.primary, -20));
  root.setProperty('--accent', t.accent);
  root.setProperty('--accent-soft', shadeColor(t.accent, 48));
  root.setProperty('--secondary', t.secondary);
  root.setProperty('--surface', t.surface);
  currentThemeKey = key;
  if(persist){ await upsertSetting('theme', { active: key }); }
  renderRibbonAndFooter();
}
async function selectTheme(key){
  await applyTheme(key, true);
  render();
}

function renderRibbonAndFooter(){
  const hostKey = currentThemeKey !== 'standard' ? currentThemeKey : null;
  document.getElementById('ribbonRow').innerHTML =
    `<span class="ribbon-label">Member Countries</span>` +
    MEMBER_COUNTRIES.map(c => `<span class="ribbon-badge ${c.key===hostKey?'host':''}"><span class="flag">${c.flag}</span>${c.name}</span>`).join('');
  document.getElementById('footerMembers').innerHTML =
    `Member countries: ` + MEMBER_COUNTRIES.map(c=>`${c.flag} ${c.name}`).join(' · ');
  const tagEl = document.getElementById('footerTagline');
  if(tagEl){ tagEl.innerText = (CONTENT && CONTENT.footerTagline) || DEFAULT_CONTENT.footerTagline; }
  const titleEl = document.getElementById('footerTitle');
  if(titleEl){ titleEl.innerText = (CONTENT && CONTENT.footerTitle) || DEFAULT_CONTENT.footerTitle; }
}

/* =========================================================
   THEME COLOR EDITOR — lets logged-in admins customize any
   theme's four colors with a native color picker + hex input.
   ========================================================= */
let themeEditDraft = null; // {key, primary, accent, secondary, surface}

function openThemeEditor(key, evt){
  if(evt) evt.stopPropagation();
  const t = THEMES[key];
  themeEditDraft = { key, primary:t.primary, accent:t.accent, secondary:t.secondary, surface:t.surface };
  renderThemeEditorModal();
}

function renderThemeEditorModal(){
  const d = themeEditDraft;
  const holder = document.getElementById('themeEditorModal');
  if(!holder) return;
  if(!d){ holder.innerHTML = ''; return; }
  const t = THEMES[d.key];
  const fields = [['primary','Primary'],['accent','Accent'],['secondary','Secondary'],['surface','Background (Surface)']];
  holder.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(22,36,31,0.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:110;">
      <div class="card-panel" style="max-width:420px;width:100%;background:#fff;">
        <h3>${t.flag} Edit ${esc(t.name)} Colors</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-8px;">
          ${d.key===currentThemeKey ? "This theme is currently active, so you'll see changes on the site live as you pick." : "This theme isn't active right now — changes will apply next time it's selected."}
        </p>
        ${fields.map(([field,label])=>`
          <div class="field">
            <label>${label}</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <input type="color" id="edit_color_${field}" value="${d[field]}"
                oninput="onThemeColorPick('${field}', this.value)"
                style="width:46px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;flex-shrink:0;">
              <input type="text" id="edit_hex_${field}" value="${d[field].toUpperCase()}"
                oninput="onThemeHexType('${field}', this.value)"
                style="flex:1;font-family:var(--mono);text-transform:uppercase;">
            </div>
          </div>
        `).join('')}
        <div style="display:flex;gap:10px;justify-content:space-between;margin-top:8px;flex-wrap:wrap;">
          <button type="button" class="btn btn-outline btn-sm" onclick="resetThemeEdit()">Reset to Default</button>
          <div style="display:flex;gap:8px;">
            <button type="button" class="btn btn-outline" onclick="cancelThemeEdit()">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="saveThemeEdit()">Save &amp; Close</button>
          </div>
        </div>
      </div>
    </div>`;
}

function livePreviewThemeField(field, val){
  if(!themeEditDraft || themeEditDraft.key !== currentThemeKey) return;
  const root = document.documentElement.style;
  if(field==='primary'){
    root.setProperty('--primary', val);
    root.setProperty('--primary-light', shadeColor(val, 22));
    root.setProperty('--primary-dark', shadeColor(val, -20));
  } else if(field==='accent'){
    root.setProperty('--accent', val);
    root.setProperty('--accent-soft', shadeColor(val, 48));
  } else if(field==='secondary'){
    root.setProperty('--secondary', val);
  } else if(field==='surface'){
    root.setProperty('--surface', val);
  }
}
function onThemeColorPick(field, val){
  themeEditDraft[field] = val;
  const hexEl = document.getElementById('edit_hex_'+field);
  if(hexEl) hexEl.value = val.toUpperCase();
  livePreviewThemeField(field, val);
}
function onThemeHexType(field, val){
  if(/^#[0-9A-Fa-f]{6}$/.test(val)){
    themeEditDraft[field] = val;
    const colorEl = document.getElementById('edit_color_'+field);
    if(colorEl) colorEl.value = val;
    livePreviewThemeField(field, val);
  }
}
function cancelThemeEdit(){
  if(themeEditDraft && themeEditDraft.key === currentThemeKey){
    applyTheme(currentThemeKey, false); // revert any unsaved live preview
  }
  themeEditDraft = null;
  renderThemeEditorModal();
}
async function saveThemeEdit(){
  if(!themeEditDraft) return;
  const { key, primary, accent, secondary, surface } = themeEditDraft;
  await saveThemeOverride(key, { primary, accent, secondary, surface });
  if(key === currentThemeKey){ await applyTheme(key, true); }
  themeEditDraft = null;
  render();
}
async function resetThemeEdit(){
  if(!themeEditDraft) return;
  const key = themeEditDraft.key;
  await resetThemeOverride(key);
  if(key === currentThemeKey){ await applyTheme(key, true); }
  themeEditDraft = null;
  render();
}

/* =========================================================
   SITE CONTENT EDITOR — lets admins rewrite the hero text,
   About page, executive committee names, contact details,
   and footer tagline without touching any code.
   ========================================================= */
let contentDraft = null;

function openContentEditor(){
  contentDraft = JSON.parse(JSON.stringify(CONTENT));
  renderContentEditorModal();
}
function closeContentEditor(){
  contentDraft = null;
  const el = document.getElementById('contentEditorModal');
  if(el) el.innerHTML = '';
}
function updateContentField(field, val){ contentDraft[field] = val; }
function updateExecName(role, val){ contentDraft.execNames[role] = val; }

function addHeroStat(){

async function saveContentEdit(){
  if(!contentDraft) return;
  contentDraft.heroStats = (contentDraft.heroStats||[]).filter(s=> (s.value&&s.value.trim()) || (s.label&&s.label.trim()) );
  contentDraft.addressLines = (contentDraft.addressLines||[]).map(l=>l.trim()).filter(Boolean);
  await saveContent(contentDraft);
  if(session && CONTENT.execNames[session.username]){
    session.name = CONTENT.execNames[session.username];
  }
  contentDraft = null;
  render();
}

function esc(str){
  const d = document.createElement('div');
  d.innerText = (str===undefined||str===null) ? '' : String(str);
  return d.innerHTML;
}
function fmtDate(iso){
  try{ return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }
  catch(e){ return iso; }
}
function excerpt(text, n){
  const t = text.replace(/\n+/g,' ');
  return t.length > n ? t.slice(0,n).trim()+'…' : t;
}
function colorFor(seedStr){
  let h=0; for(let i=0;i<seedStr.length;i++){ h = (h*31 + seedStr.charCodeAt(i)) % PLACEHOLDER_COLORS.length; }
  return PLACEHOLDER_COLORS[Math.abs(h)];
}

/* =========================================================
   CONTENT BLOCKS — a post is now an ordered list of blocks
   (text / image / gallery / table / file), so admins can mix
   several of each in any arrangement within one post.
   Posts saved under the old single-type shape (type/content/
   images/tableHeaders/tableRows) are converted to blocks
   on the fly here, so nothing needs to be migrated in the
   database — they're upgraded automatically the next time
   they're viewed or edited and saved.
   ========================================================= */
function migrateToBlocks(post){
  if(post.blocks && Array.isArray(post.blocks) && post.blocks.length){ return post.blocks; }
  const blocks = [];
  if(post.content){ blocks.push({ type:'text', content: post.content }); }
  if(post.type==='gallery' && post.images && post.images.length){
    blocks.push({ type:'gallery', images: post.images.map(img=>({ url: img.url||'', caption: img.caption||'' })) });
  }
  if(post.type==='table' && post.tableHeaders){
    blocks.push({ type:'table', headers: post.tableHeaders.slice(), rows: post.tableRows.map(r=>r.slice()) });
  }
  if(!blocks.length){ blocks.push({ type:'text', content:'' }); }
  return blocks;
}
function blockIcon(type){ return { text:'¶', image:'🖼', gallery:'◇', table:'▦', file:'⬇', embed:'▶' }[type] || '¶'; }
function blockLabel(type){ return { text:'Text', image:'Image', gallery:'Image Gallery', table:'Table', file:'File Download', embed:'Video / App Embed' }[type] || type; }

function getPostExcerpt(post, maxLen){
  const textBlock = migrateToBlocks(post).find(b=>b.type==='text' && b.content && b.content.trim());
  return textBlock ? excerpt(textBlock.content, maxLen) : '';
}

function postCardHtml(p){
  const blocks = migrateToBlocks(p);
  const typeIcons = [...new Set(blocks.map(b=>b.type))].map(blockIcon).join(' ');
  const excerptText = getPostExcerpt(p, 160);
  return `
    <div class="post-card" onclick="navigate('post-${p.id}')">
      <div class="post-meta">${pillHtml(p)}<span>${fmtDate(p.date)}</span><span class="type-icon">${typeIcons}</span></div>
      <h3>${esc(p.title)}</h3>
      ${excerptText ? `<p class="post-excerpt">${esc(excerptText)}</p>` : ''}
    </div>`;
}
function emptyState(msg){ return `<div class="empty-state">${esc(msg)}</div>`; }

/* Tracks which subcategory tab is active per top-level category
   (e.g. Conferences → Upcoming/Past), keyed by category key. */
let categoryTab = {};
function pageCategory(catKey){
  const cat = findCategory(catKey);
  if(!cat) return `<div class="wrap section">${emptyState('Category not found.')}</div>`;
  const subs = cat.subcategories || [];
  let posts;
  let tabsHtml = '';
  if(subs.length){
    if(!categoryTab[catKey] || !subs.some(s=>s.key===categoryTab[catKey])){ categoryTab[catKey] = subs[0].key; }
    const activeSub = categoryTab[catKey];
    posts = POSTS.filter(p=>{ const eff = effectiveCategory(p); return eff.category===catKey && eff.subcategory===activeSub; });
    tabsHtml = `<div class="tab-row">${subs.map(s=>`<button class="tab-btn ${activeSub===s.key?'active':''}" onclick="categoryTab['${catKey}']='${s.key}';render();">${esc(s.label)}</button>`).join('')}</div>`;
    posts.sort((a,b)=> new Date(b.date)-new Date(a.date));
    return `<div class="wrap section"><h2>${esc(cat.label)}</h2>
      ${tabsHtml}
      <div class="post-list">${posts.map(postCardHtml).join('') || emptyState(`No posts in ${esc(subs.find(s=>s.key===activeSub).label)} yet.`)}</div></div>`;
  }
  posts = POSTS.filter(p=>effectiveCategory(p).category===catKey).sort((a,b)=> new Date(b.date)-new Date(a.date));
  return `<div class="wrap section"><h2>${esc(cat.label)}</h2>
    <div class="post-list" style="margin-top:22px;">${posts.map(postCardHtml).join('') || emptyState('No posts yet.')}</div></div>`;
}

function pagePostDetail(id){
  const p = POSTS.find(x=>x.id===id);
  if(!p) return `<div class="wrap section">${emptyState('Post not found.')}</div>`;

function renderPostBlock(block){
  if(block.type==='text'){
    if(!block.content) return '';
    return `<div style="white-space:pre-line;color:var(--ink-soft);font-size:15.5px;margin-bottom:22px;">${esc(block.content)}</div>`;
  }
  if(block.type==='image'){
    if(!block.url) return '';
    const galleryIdx = PAGE_GALLERIES.push([{ url: block.url, caption: block.caption||'' }]) - 1;
    return `<figure style="margin:0 0 22px 0;">
      <img src="${esc(block.url)}" alt="${esc(block.caption||'')}" style="width:100%;border-radius:var(--radius);display:block;cursor:zoom-in;" onclick="openLightboxFromRegistry(${galleryIdx},0)">
      ${block.caption ? `<figcaption style="font-size:13px;color:var(--ink-soft);margin-top:6px;">${esc(block.caption)}</figcaption>` : ''}
    </figure>`;
  }
  if(block.type==='gallery'){
    if(!block.images || !block.images.length) return '';
    const realPhotos = block.images.filter(img=>img.url);
    const hasRealPhotos = realPhotos.length > 0;
    const galleryIdx = hasRealPhotos ? PAGE_GALLERIES.push(realPhotos) - 1 : -1;
    let photoCounter = 0;
    let html = `<div class="gallery-grid" style="margin-bottom:${hasRealPhotos?'22px':'2px'};">` + block.images.map(img=>{
      if(img.url){
        const thisIdx = photoCounter++;
        return `<div class="gallery-tile" style="background-image:url('${esc(img.url)}');background-size:cover;background-position:center;cursor:zoom-in;" onclick="openLightboxFromRegistry(${galleryIdx},${thisIdx})">${img.caption ? `<span class="cap">${esc(img.caption)}</span>` : ''}</div>`;
      }
      const c = colorFor(img.caption||'x');
      return `<div class="gallery-tile" style="background:${c};"><span class="ph-icon">🖼</span><span class="cap">${esc(img.caption||'Untitled image')}</span></div>`;
    }).join('') + `</div>`;
    if(!hasRealPhotos){ html += `<p style="font-size:12px;color:var(--ink-soft);margin-bottom:22px;">Placeholder gallery — real photographs can be uploaded from the admin dashboard.</p>`; }
    return html;
  }
  if(block.type==='table'){
    if(!block.headers || !block.headers.length) return '';
    return `<div class="table-scroll" style="margin-bottom:22px;"><table class="data-table"><thead><tr>${block.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`
      + block.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('') + `</tbody></table></div>`;
  }
  if(block.type==='file'){
    if(!block.url) return '';
    return `<div class="file-download-card">
      <div class="file-download-icon">📄</div>
      <div style="flex:1;min-width:0;"><div style="font-weight:600;overflow-wrap:break-word;">${esc(block.fileName || 'Attached file')}</div></div>
      <a class="btn btn-primary btn-sm" href="${esc(block.url)}" download="${esc(block.fileName||'')}" target="_blank" rel="noopener">${esc(block.label || 'Download')}</a>
    </div>`;
  }
  if(block.type==='embed'){
    let inner = '';
    if(block.embedUrl){
      inner = `<div class="embed-wrap"><iframe src="${esc(toEmbedUrl(block.embedUrl))}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>`;
    } else if(block.videoUrl){
      inner = `<video controls style="width:100%;border-radius:var(--radius);display:block;background:#000;"><source src="${esc(block.videoUrl)}"></video>`;
    } else {
      return '';
    }
    return `<div style="margin-bottom:22px;">${inner}${block.caption ? `<p style="font-size:13px;color:var(--ink-soft);margin-top:6px;">${esc(block.caption)}</p>` : ''}</div>`;
  }
  return '';
}

/* Converts a plain YouTube/Vimeo link into its embeddable iframe URL; any
   other URL (a Google Form, a hosted app, etc.) is passed through as-is. */
function toEmbedUrl(url){
  const u = String(url||'').trim();
  let m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]+)/);
  if(m) return `https://www.youtube.com/embed/${m[1]}`;
  m = u.match(/vimeo\.com\/(\d+)/);
  if(m) return `https://player.vimeo.com/video/${m[1]}`;
  return u;
}

/* =========================================================
   LIGHTBOX / CAROUSEL — click any real photo (single image or
   gallery block) to view it full-size, with chevron navigation
   between the other photos in that same block.
   ========================================================= */
let PAGE_GALLERIES = [];
let lightboxImages = [];
let lightboxIndex = 0;

function openLightboxFromRegistry(galleryIdx, photoIdx){
  const imgs = PAGE_GALLERIES[galleryIdx];
  if(!imgs || !imgs.length) return;
  lightboxImages = imgs;
  lightboxIndex = photoIdx;
  renderLightbox();
}
function closeLightbox(){
  lightboxImages = [];
  const holder = document.getElementById('lightboxOverlay');
  if(holder) holder.innerHTML = '';
}
function lightboxNav(dir){
  if(!lightboxImages.length) return;
  lightboxIndex = (lightboxIndex + dir + lightboxImages.length) % lightboxImages.length;
  renderLightbox();
}
function renderLightbox(){
  const holder = document.getElementById('lightboxOverlay');
  if(!holder) return;
  if(!lightboxImages.length){ holder.innerHTML = ''; return; }
  const img = lightboxImages[lightboxIndex];
  const multi = lightboxImages.length > 1;
  holder.innerHTML = `
    <div class="lightbox-backdrop" onclick="closeLightbox()">
      <button class="lightbox-close" onclick="event.stopPropagation();closeLightbox()" aria-label="Close">✕</button>
      ${multi ? `<button class="lightbox-nav lightbox-prev" onclick="event.stopPropagation();lightboxNav(-1)" aria-label="Previous image">‹</button>` : ''}
      <div class="lightbox-content" onclick="event.stopPropagation()">
        <img src="${esc(img.url)}" alt="${esc(img.caption||'')}">
        ${img.caption ? `<div class="lightbox-caption">${esc(img.caption)}</div>` : ''}
        ${multi ? `<div class="lightbox-counter">${lightboxIndex+1} / ${lightboxImages.length}</div>` : ''}
      </div>
      ${multi ? `<button class="lightbox-nav lightbox-next" onclick="event.stopPropagation();lightboxNav(1)" aria-label="Next image">›</button>` : ''}
    </div>`;
}
document.addEventListener('keydown', function(e){
  if(!lightboxImages.length) return;
  if(e.key === 'Escape'){ closeLightbox(); }
  else if(e.key === 'ArrowLeft'){ lightboxNav(-1); }
  else if(e.key === 'ArrowRight'){ lightboxNav(1); }
});

/* Hero background slideshow — only does anything when the home page's
   slideshow element is actually in the DOM; harmlessly no-ops elsewhere. */
let heroSlideIndex = 0;
function advanceHeroSlide(){
  const holder = document.getElementById('heroSlideshow');
  if(!holder) return;
  const slides = holder.querySelectorAll('.hero-bg-slide');
  if(slides.length < 2) return;
  const nextIndex = (heroSlideIndex + 1) % slides.length;
  // Any slide not involved in this transition gets silently reset to its
  // off-screen-right starting position (invisible either way, since both
  // its 'prev' state and its base state sit at opacity:0) so it always
  // re-enters from the right on its next turn, never drifts to the left.
  slides.forEach((s,i)=>{ if(i!==heroSlideIndex && i!==nextIndex){ s.classList.remove('active','prev'); } });
  slides[heroSlideIndex].classList.remove('active');
  slides[heroSlideIndex].classList.add('prev');
  slides[nextIndex].classList.add('active');
  heroSlideIndex = nextIndex;
}
setInterval(advanceHeroSlide, 5000);

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if(error || !data.user){

    .from('admin_roles')

  else if(type==='image') block = { type:'image', url:'', caption:'' };
  else if(type==='gallery') block = { type:'gallery', images:[{caption:''}] };
  else if(type==='table') block = { type:'table', headers:['Column 1','Column 2'], rows:[['','']] };
  else if(type==='file') block = { type:'file', url:'', fileName:'', label:'Download' };
  else if(type==='embed') block = { type:'embed', embedUrl:'', videoUrl:'', videoFileName:'', caption:'' };
  else return;
  formDraft.blocks.push(block);
  renderPostFormModal();
}
function removeBlock(i){
  if(formDraft.blocks.length<=1){ alert('A post needs at least one content block.'); return; }
  formDraft.blocks.splice(i,1);
  renderPostFormModal();
}
function moveBlock(i, dir){
  const j = i+dir;
  if(j<0 || j>=formDraft.blocks.length) return;
  const tmp = formDraft.blocks[i]; formDraft.blocks[i] = formDraft.blocks[j]; formDraft.blocks[j] = tmp;
  renderPostFormModal();
}
function updateBlockField(i, field, val){ formDraft.blocks[i][field] = val; }

// Gallery-block image list
function addGalleryBlockImage(bi){ formDraft.blocks[bi].images.push({caption:''}); renderPostFormModal(); }
function removeGalleryBlockImage(bi, ii){ formDraft.blocks[bi].images.splice(ii,1); renderPostFormModal(); }
function updateGalleryBlockCaption(bi, ii, val){ formDraft.blocks[bi].images[ii].caption = val; }

// Table-block editing
function addTableBlockColumn(bi){ const b=formDraft.blocks[bi]; b.headers.push('Column '+(b.headers.length+1)); b.rows.forEach(r=>r.push('')); renderPostFormModal(); }
function updateTableBlockHeader(bi, ci, val){ formDraft.blocks[bi].headers[ci] = val; }
function addTableBlockRow(bi){ const b=formDraft.blocks[bi]; b.rows.push(b.headers.map(()=>'')); renderPostFormModal(); }
function removeTableBlockRow(bi, ri){ formDraft.blocks[bi].rows.splice(ri,1); renderPostFormModal(); }
function updateTableBlockCell(bi, ri, ci, val){ formDraft.blocks[bi].rows[ri][ci] = val; }

/* Shared photo pipeline: downsize to a sane max dimension, re-encode as a
   compressed JPEG, and upload to the 'post-images' bucket in Supabase
   Storage — used by both single-image blocks and gallery-block images. */
const GALLERY_MAX_DIMENSION = 1280;
const GALLERY_JPEG_QUALITY = 0.82;
function compressAndUploadImage(file, onDone){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > GALLERY_MAX_DIMENSION || h > GALLERY_MAX_DIMENSION){
        if(w >= h){ h = Math.round(h * (GALLERY_MAX_DIMENSION / w)); w = GALLERY_MAX_DIMENSION; }
        else { w = Math.round(w * (GALLERY_MAX_DIMENSION / h)); h = GALLERY_MAX_DIMENSION; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(async function(blob){
        const fileName = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
        const { error: uploadError } = await supabaseClient.storage.from('post-images').upload(fileName, blob, {
          contentType: 'image/jpeg', upsert: false
        });
        if(uploadError){ console.error(uploadError); onDone(null); return; }
        const { data: urlData } = supabaseClient.storage.from('post-images').getPublicUrl(fileName);
        onDone(urlData.publicUrl);
      }, 'image/jpeg', GALLERY_JPEG_QUALITY);
    };
    img.onerror = function(){ onDone(null); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ onDone(null); };
  reader.readAsDataURL(file);
}
function handleImageBlockUpload(bi, file){
  if(!file) return;
  if(!file.type || !file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
  formDraft.blocks[bi].uploading = true;
  renderPostFormModal();
  compressAndUploadImage(file, function(url){
    formDraft.blocks[bi].uploading = false;
    if(!url){ alert("Couldn't upload that photo. Make sure you're logged in."); renderPostFormModal(); return; }
    formDraft.blocks[bi].url = url;
    renderPostFormModal();
  });
}
function handleGalleryBlockFileSelect(bi, ii, file){
  if(!file) return;
  if(!file.type || !file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
  formDraft.blocks[bi].images[ii].uploading = true;
  renderPostFormModal();
  compressAndUploadImage(file, function(url){
    formDraft.blocks[bi].images[ii].uploading = false;
    if(!url){ alert("Couldn't upload that photo. Make sure you're logged in."); renderPostFormModal(); return; }
    formDraft.blocks[bi].images[ii].url = url;
    renderPostFormModal();
  });
}

/* File-download block: uploads the original file as-is (no compression,
   since it might not be an image at all) to the same public bucket. */
const FILE_BLOCK_MAX_MB = 20;
function handleFileBlockUpload(bi, file){
  if(!file) return;
  if(file.size > FILE_BLOCK_MAX_MB*1024*1024){
    alert(`That file is larger than ${FILE_BLOCK_MAX_MB}MB — please use a smaller file.`);
    return;
  }
  formDraft.blocks[bi].uploading = true;
  renderPostFormModal();
  (async () => {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const storagePath = `${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safeName}`;
    const { error: uploadError } = await supabaseClient.storage.from('post-images').upload(storagePath, file, {
      contentType: file.type || 'application/octet-stream',
      upsert: false
    });
    formDraft.blocks[bi].uploading = false;
    if(uploadError){
      console.error(uploadError);
      alert("Couldn't upload that file. Make sure you're logged in.");
      renderPostFormModal();
      return;
    }
    const { data: urlData } = supabaseClient.storage.from('post-images').getPublicUrl(storagePath);
    formDraft.blocks[bi].url = urlData.publicUrl;
    formDraft.blocks[bi].fileName = file.name;
    if(!formDraft.blocks[bi].label){ formDraft.blocks[bi].label = 'Download'; }
    renderPostFormModal();
  })();
}

const EMBED_VIDEO_MAX_MB = 50;
function handleEmbedVideoUpload(bi, file){
  if(!file) return;
  if(!file.type || !file.type.startsWith('video/')){
    alert('Please choose a video file.');
    return;
  }
  if(file.size > EMBED_VIDEO_MAX_MB*1024*1024){

    return;
  }
  formDraft.blocks[bi].uploading = true;
  renderPostFormModal();
  (async () => {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const storagePath = `${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safeName}`;
    const { error: uploadError } = await supabaseClient.storage.from('post-images').upload(storagePath, file, {
      contentType: file.type || 'video/mp4',
      upsert: false
    });
    formDraft.blocks[bi].uploading = false;
    if(uploadError){
      console.error(uploadError);
      alert("Couldn't upload that video. Make sure you're logged in.");
      renderPostFormModal();
      return;
    }
    const { data: urlData } = supabaseClient.storage.from('post-images').getPublicUrl(storagePath);
    formDraft.blocks[bi].videoUrl = urlData.publicUrl;

    renderPostFormModal();
  })();
}

async function submitPostForm(e){
  e.preventDefault();
  formDraft.title = document.getElementById('f_title').value.trim();
  formDraft.date = document.getElementById('f_date').value || new Date().toISOString().slice(0,10);
  if(!formDraft.title) return;

  // Strip transient "uploading" flags before saving — they're UI-only state.
  formDraft.blocks.forEach(b=>{
    delete b.uploading;
    if(b.type==='gallery' && b.images){ b.images.forEach(img=>delete img.uploading); }
  });

  const submitBtn = e.target.querySelector('button[type="submit"]');
  const originalLabel = submitBtn ? submitBtn.textContent : '';
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }

  const idx = POSTS.findIndex(p=>p.id===formDraft.id);
  const toSave = JSON.parse(JSON.stringify(formDraft));
  const previousPosts = JSON.parse(JSON.stringify(POSTS));
  if(idx>-1){ POSTS[idx] = toSave; } else { POSTS.unshift(toSave); }
  const saved = await savePosts(POSTS);
  if(!saved){
    POSTS = previousPosts; // roll back so in-memory state matches what's actually persisted
    alert("The post couldn't be saved. Make sure you're still logged in, then try again.");
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = originalLabel; }
    return;
  }
  closePostForm();
  render();
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  closeLightbox();
  renderNav();
  const route = currentRoute();
  const app = document.getElementById('app');
  if(route === 'home') app.innerHTML = pageHome();
  else if(route === 'about') app.innerHTML = pageAbout();
  else if(route === 'contact') app.innerHTML = pageContact();
  else if(route === 'login') app.innerHTML = session ? pageAdmin() : pageLogin();
  else if(route === 'admin') app.innerHTML = pageAdmin();
  else if(route.startsWith('post-')) app.innerHTML = pagePostDetail(route.slice(5));
  else if(route.startsWith('cat-')) app.innerHTML = pageCategory(route.slice(4));
  else if(route === 'current-work') app.innerHTML = pageCategory('current'); // legacy link support
  else if(route === 'conferences') app.innerHTML = pageCategory('conferences'); // legacy link support
  else app.innerHTML = pageHome();
  if(route==='admin' && formDraft){ renderPostFormModal(); }
  if(route==='admin' && themeEditDraft){ renderThemeEditorModal(); }
  if(route==='admin' && contentDraft){ renderContentEditorModal(); }
  if(route==='admin' && categoryDraft){ renderCategoryEditorModal(); }
  window.scrollTo(0,0);
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  document.getElementById('app').innerHTML = `<div class="wrap section"><div class="empty-state">Loading SAARC-AA…</div></div>`;
  try{
    THEMES = await buildThemes();
    CONTENT = await loadContent();
    CATEGORIES = await loadCategories();
    const savedThemeSetting = await fetchSetting('theme', { active: 'standard' });
    await applyTheme(savedThemeSetting.active || 'standard', false);
    POSTS = await loadPosts();
    VISIT_COUNT = await getVisitCount();
  }catch(err){
    console.error('Failed to load site data from Supabase', err);
    document.getElementById('app').innerHTML = `<div class="wrap section"><div class="alert alert-error">We're having trouble loading the site right now. Please try again shortly.</div></div>`;
    return;
  }
  render();
})();
</script>
